name: Deploy Pakkasukko preview
on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/pakkasukko-deploy.yml'
      - 'scripts/deploy-preview.mjs'
      - 'wrangler.toml'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'schema.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency: pakkasukko-cloudflare-preview
jobs:
  deploy:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm install --no-save --no-package-lock wrangler@4.167.0 sharp@0.34.5
      - run: node scripts/optimize-spatial.mjs
      - run: node scripts/deploy-preview.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAKKASUKKO_ADMIN_PASSWORD: ${{ secrets.PAKKASUKKO_ADMIN_PASSWORD }}
          PAKKASUKKO_TURNSTILE_SITE_KEY: ${{ secrets.PAKKASUKKO_TURNSTILE_SITE_KEY }}
          PAKKASUKKO_TURNSTILE_SECRET: ${{ secrets.PAKKASUKKO_TURNSTILE_SECRET }}
          PAKKASUKKO_RESEND_API_KEY: ${{ secrets.PAKKASUKKO_RESEND_API_KEY }}
          PAKKASUKKO_OWNER_EMAIL: ${{ secrets.PAKKASUKKO_OWNER_EMAIL }}
          PAKKASUKKO_FROM_EMAIL: ${{ secrets.PAKKASUKKO_FROM_EMAIL }}
