name: Pakkasukko tests
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/worker.js
      - run: node --check docs/app.js
      - run: node --check docs/admin.js
      - run: node --check docs/inline-editor.js
  snow-browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python scripts/test-snow-browser.py ${{ matrix.engine }}
